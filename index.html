<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Tournament</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: white;
        }
        .location {
            font-size: 14px;
        }
        .auth {
            font-size: 14px;
        }
        .auth a {
            color: white;
            text-decoration: none;
            margin-left: 10px;
        }
        .auth a:hover {
            text-decoration: underline;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            border-radius: 5px;
        }
        .popup button {
            margin-top: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                document.getElementById("location").innerHTML = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;
            document.getElementById("location").innerHTML = `📍 Lat: ${lat.toFixed(2)}, Lon: ${lon.toFixed(2)}`;
        }

        function showError(error) {
            if (error.code === error.PERMISSION_DENIED) {
                document.getElementById("popup").style.display = "block";
            } else {
                let message = "An error occurred while retrieving location.";
                if (error.code === error.POSITION_UNAVAILABLE) message = "Location information is unavailable.";
                if (error.code === error.TIMEOUT) message = "The request to get user location timed out.";
                document.getElementById("location").innerHTML = message;
            }
        }

        function requestLocationAgain() {
            document.getElementById("popup").style.display = "none";
            getLocation();
        }
    </script>
</head>
<body onload="getLocation()">
    <header>
        <div class="location" id="location">📍 Detecting location...</div>
        <div class="auth">
            <a href="#">Login</a> / <a href="#">Register</a>
        </div>
    </header>
    <main>
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Virat_Kohli.jpg" alt="Virat Kohli">
    </main>
    <footer>
        spottournament
    </footer>
    <div id="popup" class="popup">
        <p>Please click below to enable location.</p>
        <button onclick="requestLocationAgain()">Enable Location</button>
    </div>
</body>
</html>

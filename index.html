<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Tournament</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: white;
        }
        .location {
            font-size: 14px;
        }
        .auth {
            font-size: 14px;
        }
        .auth a {
            color: white;
            text-decoration: none;
            margin-left: 10px;
        }
        .auth a:hover {
            text-decoration: underline;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="location">📍 Your Location</div>
        <div class="auth">
            <a href="#">Login</a> / <a href="#">Register</a>
        </div>
    </header>
    <main>
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Virat_Kohli.jpg" alt="Virat Kohli">
    </main>
    <footer>
        spottournament
    </footer>
</body>
</html>
